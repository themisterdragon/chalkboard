# Push a tag like v1.7.0 to build every download on a Mac and attach them to a draft release.
# Check the draft on GitHub (try the DMG), then press Publish.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check the tag matches the version
        run: |
          version=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' src/chalkboard/__init__.py)
          [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME but __version__ is $version"; exit 1; }

      - name: Build
        run: |
          python3 scripts/build_mac.py
          python3 -m pip wheel --no-deps -w dist .
          sh scripts/build_dmg.sh

      - name: Test the downloads
        run: |
          python3 dist/chalkboard.pyz --version
          mnt=$(hdiutil attach -nobrowse -readonly dist/Chalkboard-*.dmg | awk -F'\t' '/Volumes/ {print $NF}')
          ls -la "$mnt"
          test -L "$mnt/Applications"
          test -x "$mnt/Chalkboard.app/Contents/MacOS/Chalkboard"
          test -f "$mnt/Read Me First.txt"
          python3 "$mnt/Chalkboard.app/Contents/Resources/chalkboard.pyz" --version
          plutil -lint "$mnt/Chalkboard.app/Contents/Info.plist"
          hdiutil detach "$mnt"
          python3 -m pip install dist/*.whl
          chalkboard --version

      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --draft --title "Chalkboard ${GITHUB_REF_NAME#v}" \
            --notes-file .github/release-notes.md \
            dist/Chalkboard-*.dmg dist/Chalkboard-macOS.zip dist/chalkboard.pyz dist/install.sh dist/*.whl
