# Chalkboard 3 beta (the C++ version) on macOS: build the app for Apple silicon and Intel, sign it
# (ad hoc), make the DMG, then open it on real Macs and take screenshots of it working.
# Runs on pushes to the cpp-beta branch, or from the Actions tab ("Run workflow").
name: Mac beta

on:
  push:
    branches: [cpp-beta]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: Build with Apple's compiler (Apple silicon + Intel in one program)
        run: |
          CXX="clang++ -arch arm64 -arch x86_64 -mmacosx-version-min=11.0" sh core/build.sh
          lipo -info core/chalkboard-core
      - name: Chalkboard.app, signed, and the DMG
        run: |
          sh core/package-mac.sh core/chalkboard-core
          lipo -info core/dist/macos/Chalkboard.app/Contents/MacOS/Chalkboard
          codesign --verify --deep --strict --verbose=2 core/dist/macos/Chalkboard.app
          plutil -lint core/dist/macos/Chalkboard.app/Contents/Info.plist
      - uses: actions/upload-artifact@v5
        with:
          name: Chalkboard-macOS-beta
          path: core/dist/Chalkboard-*-macOS.dmg

  try:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        mac: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.mac }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v6
        with:
          name: Chalkboard-macOS-beta
      - name: Install from the DMG, like a teacher would
        run: |
          mnt=$(hdiutil attach -nobrowse -readonly Chalkboard-*-macOS.dmg | awk -F'\t' '/Volumes/ {print $NF}')
          ls -la "$mnt"
          ditto "$mnt/Chalkboard.app" /Applications/Chalkboard.app
          hdiutil detach "$mnt"
          /Applications/Chalkboard.app/Contents/MacOS/Chalkboard --version
      - name: The window app with no screen (scripted)
        run: |
          mkdir -p shots/scripted
          CHALKBOARD_DATA="$RUNNER_TEMP/data-scripted" /Applications/Chalkboard.app/Contents/MacOS/Chalkboard --no-boot \
            --script core/tests/walkthrough.txt shots/scripted
          ls shots/scripted | wc -l
      - name: Open it for real, use its menus and keys, and take pictures
        run: |
          mkdir -p shots/live
          open /Applications/Chalkboard.app
          sleep 12
          pgrep -x Chalkboard || { echo "Chalkboard isn't running"; exit 1; }
          screencapture -x shots/live/01-opened.png
          key() { osascript -e "tell application \"System Events\" to $1" || true; sleep 2; }
          key 'keystroke return'
          screencapture -x shots/live/02-return.png
          osascript -e 'tell application "System Events" to tell process "Chalkboard" to get name of every menu of menu bar 1' || true
          osascript -e 'tell application "System Events" to tell process "Chalkboard" to click menu item "Keyboard Shortcuts" of menu "Help" of menu bar 1' || true
          sleep 2
          screencapture -x shots/live/03-shortcuts.png
          key 'key code 53'
          key 'keystroke "1" using command down'
          screencapture -x shots/live/04-lessons.png
          key 'keystroke "=" using command down'
          screencapture -x shots/live/05-bigger.png
          key 'keystroke "w" using {command down, shift down}'
          sleep 2
          screencapture -x shots/live/06-terminal-view.png
          key 'keystroke "w" using {command down, shift down}'
          pgrep -x Chalkboard || { echo "Chalkboard quit on its own"; exit 1; }
          osascript -e 'tell application "Chalkboard" to quit' || true
          sleep 4
          pgrep -x Chalkboard && { echo "still running after Quit"; pkill -x Chalkboard; } || echo "quit cleanly"
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: screenshots-${{ matrix.mac }}
          path: shots
