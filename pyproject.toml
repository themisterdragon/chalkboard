[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "chalkboard-planner"
dynamic = ["version"]
description = "A retro, offline lesson planner and assessment builder for teachers"
license = { text = "GPL-3.0-only" }
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "windows-curses; sys_platform == 'win32'",
]
classifiers = [
    "Environment :: Console :: Curses",
    "Programming Language :: Python :: 3",
    "Topic :: Education",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
]

[project.scripts]
chalkboard = "chalkboard.app:main"

[project.gui-scripts]
chalkboard-gui = "chalkboard.gui:main"

[tool.setuptools.dynamic]
version = { attr = "chalkboard.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
chalkboard = ["data/*.json", "data/*.png", "data/standards/*.json"]
